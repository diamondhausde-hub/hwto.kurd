<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مشغّل الاختبار — hwto.kurd</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #eee; margin: 0; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    video { width: 100%; max-width: 900px; background: #000; display: block; border-radius: 8px; }
    #status { margin-top: 12px; font-size: 14px; color: #9aa; }
    label { display: block; margin: 16px 0 6px; font-size: 14px; color: #9aa; }
    input { width: 100%; max-width: 900px; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #161922; color: #eee; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 18px; border: 0; border-radius: 6px; background: #3b82f6; color: #fff; font-size: 14px; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>مشغّل الاختبار (استخراج وتشغيل تلقائي)</h1>
  <video id="player" controls playsinline></video>
  <div id="status">جاهز للاختبار.</div>

  <label for="src">ضع رابط المشغل (مثل fastvip.space/e/...) أو رابط m3u8 مباشر:</label>
  <input id="src" type="text" value="https://fastvip.space/e/uw2xnhcfket2" />
  <button id="play">استخراج وتشغيل</button>

  <script src="/vendor/hls.min.js"></script>
  <script>
    const video = document.getElementById('player');
    const statusEl = document.getElementById('status');
    const srcInput = document.getElementById('src');
    const playBtn = document.getElementById('play');
    let hls = null;

    // تمرير رابط الصفحة الكامل كـ Referer بدلاً من النطاق فقط
    const proxy = (streamUrl, refererUrl) => {
      const ref = refererUrl || streamUrl;
      return '/api/fastvid?url=' + encodeURIComponent(streamUrl) + '&from=' + encodeURIComponent(ref);
    };

    function playStream(m3u8Url, embedPageUrl) {
      if (hls) { hls.destroy(); hls = null; }
      statusEl.textContent = 'جارٍ تحميل الفيديو عبر البروكسي…';

      const proxied = proxy(m3u8Url, embedPageUrl);

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(proxied);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          statusEl.textContent = 'تم تحميل البث بنجاح — الفيديو يعمل الآن!';
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (_event, data) => {
          statusEl.textContent = 'خطأ HLS: ' + data.type + ' / ' + data.details;
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else hls.destroy();
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = proxied;
        statusEl.textContent = 'تشغيل أصلي (Safari/iOS).';
      } else {
        statusEl.textContent = 'هذا المتصفح لا يدعم HLS.';
      }
    }

    async function handleStart() {
      const rawUrl = srcInput.value.trim();
      if (!rawUrl) return;

      if (rawUrl.includes('.m3u8')) {
        playStream(rawUrl, rawUrl);
        return;
      }

      statusEl.textContent = 'جارٍ استخراج رابط البث المباشر…';
      playBtn.disabled = true;

      try {
        const res = await fetch('/api/shahid4u-extractor?url=' + encodeURIComponent(rawUrl));
        const data = await res.json();

        if (data.success && data.stream_url) {
          statusEl.textContent = 'تم الاستخراج، جاري بدء التشغيل…';
          // نمرر رابط البث مع رابط صفحة المشغل الأصلية كـ Referer
          playStream(data.stream_url, rawUrl);
        } else {
          statusEl.textContent = 'فشل الاستخراج: ' + (data.error || 'خطأ غير معروف');
        }
      } catch (err) {
        statusEl.textContent = 'تعذر الاتصال بالمستخرج: ' + err.message;
      } finally {
        playBtn.disabled = false;
      }
    }

    playBtn.addEventListener('click', handleStart);
  </script>
</body>
</html>
